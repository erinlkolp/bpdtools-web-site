name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment authenticates with OIDC. Without id-token and pages
# write, the deploy step fails with a permissions error — this is the
# most common way this workflow breaks.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue pushes rather than letting two publishes race.
concurrency:
  group: pages
  cancel-in-progress: false

# Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 from
# 19 October 2026. This is what ubuntu-latest resolves to today, so the
# pin changes nothing now; it just makes the move to 26 a deliberate
# commit rather than a build that changes underneath us.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs the contrast gate, the build, and the output checks.
      - run: npm run verify

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
